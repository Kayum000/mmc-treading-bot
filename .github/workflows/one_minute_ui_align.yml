name: One-minute UI alignment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  align-ui:
    if: ${{ !contains(github.event.head_commit.message, '[ui-1m]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align entry UI and auto timing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/templates/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('ENTRY SIGNAL — 10 SEC BEFORE NEXT CANDLE', 'ENTRY AT NEXT 1-MINUTE CANDLE')
          s = s.replace("let target=boundary-10000;if(target<=now)target+=60000;", "let target=boundary;if(target<=now)target+=60000;")
          s = s.replace('AUTO SIGNAL চালু — পরের candle শুরুর 10 সেকেন্ড আগে signal হবে।', 'AUTO SIGNAL চালু — পরের 1-minute candle শুরু হলে signal হবে।')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/one_minute_ui_align.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/templates/index.html .github/workflows/one_minute_ui_align.yml
          git commit -m 'Align UI with 1-minute candle entry [ui-1m]'
          git push
