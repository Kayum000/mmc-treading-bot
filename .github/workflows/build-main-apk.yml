name: Build Main Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-main-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build main debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Upload main APK
        uses: actions/upload-artifact@v4
        with:
          name: mmc-main-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# Main mobile APK: full current MMC Bot WebView app; Android bridge is intentionally excluded.
