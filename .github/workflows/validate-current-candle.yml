name: Validate current-candle fix

on:
  push:
    branches:
      - fix/current-candle-entry-lock

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Validate candle outcome logic
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          src = Path('performance.py').read_text()
          tree = ast.parse(src)
          names = {n.name for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
          required = {'record_signal', '_entry_candle', '_candle_color', '_outcome', 'settle_pending'}
          missing = required - names
          assert not missing, f'missing functions: {missing}'
          assert "return 'GREEN' if c>o else 'RED' if c<o else 'DOJI'" in src
          assert "target=_minute_start(entry_time)" in src
          assert "result='PENDING'" in src and "entry_time_utc + INTERVAL '1 minute' > NOW()" in src
          assert 'Signal candle color:' in src
          print('Current-candle validation: PASS')
          PY
