name: Validate current-candle fix

on:
  push:
    branches:
      - fix/current-candle-entry-lock

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Validate current-candle behavior
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          src = Path('performance.py').read_text()
          tree = ast.parse(src)
          required = {'record_signal', '_reject_entry', '_entry_candle', '_candle_color', '_outcome', 'settle_pending'}
          funcs = {n.name: n for n in tree.body if isinstance(n, ast.FunctionDef)}
          assert not (required - funcs)
          def source_of(name):
              node = funcs[name]
              return ast.get_source_segment(src, node)
          outcome = source_of('_outcome')
          color = source_of('_candle_color')
          entry = source_of('_entry_candle')
          reject = source_of('_reject_entry')
          record = source_of('record_signal')
          assert "return 'GREEN' if c>o else 'RED' if c<o else 'DOJI'" in color
          assert "target=_minute_start(entry_time)" in entry
          assert "entry_time_utc + INTERVAL '1 minute' > NOW()" in record
          assert "result['signal']='NO_TRADE'" in reject
          assert "result['is_entry']=False" in reject
          assert "Signal candle color:" in source_of('settle_pending')
          # Pure candle-color outcome checks matching production rules.
          ns = {}
          exec('def _candle_color(candle):\n    o=float(candle[\'open\']); c=float(candle[\'close\'])\n    return \'GREEN\' if c>o else \'RED\' if c<o else \'DOJI\'\n\n' + outcome, ns)
          assert ns['_outcome']('BUY', {'open': 1, 'close': 2}) == 'WIN'
          assert ns['_outcome']('BUY', {'open': 2, 'close': 1}) == 'LOSS'
          assert ns['_outcome']('SELL', {'open': 2, 'close': 1}) == 'WIN'
          assert ns['_outcome']('SELL', {'open': 1, 'close': 2}) == 'LOSS'
          assert ns['_outcome']('BUY', {'open': 1, 'close': 1}) == 'VOID'
          print('Current-candle validation: PASS')
          PY