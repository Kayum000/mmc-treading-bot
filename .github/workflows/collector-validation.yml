name: Collector bridge validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check collector Python syntax
        run: python -m py_compile tools/quotex_local_collector.py
