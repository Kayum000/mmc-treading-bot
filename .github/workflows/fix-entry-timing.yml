name: Apply entry timing patch

on:
  push:
    paths:
      - .github/workflows/fix-entry-timing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch signal timing
        shell: python
        run: |
          from pathlib import Path

          path = Path('web/templates/index.html')
          text = path.read_text(encoding='utf-8')

          old_delay = "function nextAutoDelayMs(){const now=Date.now(),next=(Math.floor(now/60000)+1)*60000;return Math.max(1500,next-now+1500)}"
          new_delay = "function nextAutoDelayMs(){const now=Date.now(),boundary=(Math.floor(now/60000)+1)*60000;let target=boundary-10000;if(target<=now)target+=60000;return Math.max(250,target-now)}"
          if old_delay not in text:
              raise SystemExit('Expected auto-signal scheduler was not found; refusing to modify the file.')
          text = text.replace(old_delay, new_delay, 1)

          text = text.replace('ENTRY TIME — NEXT 1-MINUTE CANDLE', 'ENTRY SIGNAL — 10 SEC BEFORE NEXT CANDLE')
          text = text.replace('AUTO SIGNAL চালু — পরের 1 মিনিটের candle-এ আবার signal হবে।', 'AUTO SIGNAL চালু — পরের candle শুরুর 10 সেকেন্ড আগে signal হবে।')
          text = text.replace('AUTO SIGNAL চালু — প্রথম signal তৈরি হচ্ছে…', 'AUTO SIGNAL চালু — পরের candle-এর জন্য signal প্রস্তুত হচ্ছে…')

          path.write_text(text, encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/templates/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: issue auto signal 10 seconds before next candle"
          git push