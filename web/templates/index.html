<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMC Live Signal</title></head>
<body>
<main>
<h1>MMC Live Forex Signal</h1>
<p>Select one market. Data is fetched only when you request a signal.</p>
<form method="post">
<label>Forex pair
<select name="pair">{% for p in pairs %}<option value="{{p}}" {% if p == pair %}selected{% endif %}>{{p}}</option>{% endfor %}</select>
</label>
<button type="submit">GET SIGNAL</button>
</form>
{% if error %}<p><strong>Error:</strong> {{error}}</p>{% endif %}
{% if result %}<section><h2>{{result.pair}} — {{result.signal}}</h2><p>Buy score: {{result.buy_score}}</p><p>Sell score: {{result.sell_score}}</p><p>Reason: {{result.reason}}</p></section>{% endif %}
</main>
</body>
</html>
