<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Account — MMC Live Signal</title>
<style>body{margin:0;background:#f5f7fb;font-family:Arial,sans-serif;color:#172033;min-height:100vh;display:flex;align-items:center;justify-content:center}.box{width:min(420px,calc(100% - 40px));background:#fff;border-radius:18px;padding:28px;box-shadow:0 4px 20px rgba(0,0,0,.1)}h1{margin:0 0 8px}p{color:#5b6475}label{display:block;font-weight:700;margin:15px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:17px}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700;font-size:18px}.error,.success{border-radius:10px;padding:10px;margin:10px 0}.error{background:#fff1f2;color:#b42318;border:1px solid #fecdd3}.success{background:#ecfdf3;color:#067647;border:1px solid #a7f3d0}.link{text-align:center;margin-top:15px}</style>
</head>
<body><div class="box"><h1>Create your MMC account</h1><p>Each account gets its own market settings and signal history.</p>
{% if error %}<div class="error">{{error}}</div>{% endif %}
{% if success %}<div class="success">{{success}}</div>{% else %}<form method="post" autocomplete="on"><label>Username</label><input name="username" minlength="3" maxlength="64" required autofocus><label>Email (optional)</label><input name="email" type="email" autocomplete="email"><label>Password</label><input name="password" type="password" minlength="8" autocomplete="new-password" required><button type="submit">CREATE ACCOUNT</button></form>{% endif %}
<div class="link"><a href="{{ url_for('login') }}">Already have an account? Login</a></div></div></body></html>
