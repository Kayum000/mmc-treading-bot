<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MMC Trading Bot — Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06172e;color:#e8f2ff;font-family:Inter,Arial,sans-serif;padding:20px}
.login-card{width:min(390px,100%);background:#071f3a;border:1px solid #12365d;border-radius:14px;padding:26px;box-shadow:0 20px 60px #0008}
.logo{display:grid;place-items:center;margin-bottom:12px}.logo img{width:58px;height:58px}.login-card h1{margin:0;text-align:center;font-size:22px}.login-card p{margin:7px 0 22px;text-align:center;color:#8fa8c0;font-size:12px}
label{display:block;color:#9fb7cf;font-size:11px;font-weight:800;margin:12px 0 6px}input{width:100%;height:44px;border:1px solid #173d67;border-radius:8px;background:#0a2440;color:#eef7ff;padding:0 12px;font-size:13px;outline:none}input:focus{border-color:#1684ee}.btn{width:100%;height:44px;margin-top:18px;border:0;border-radius:8px;background:linear-gradient(135deg,#0759ba,#1684ee);color:#fff;font-size:13px;font-weight:900;cursor:pointer}.error{margin:0 0 12px;padding:9px 10px;border-radius:7px;background:#4b1620;color:#ffb5bf;border:1px solid #7d2635;font-size:11px}
</style>
</head>
<body>
<main class="login-card">
  <div class="logo"><img src="{{ url_for('static', filename='sk_bot_logo.svg') }}" alt="MMC"></div>
  <h1>MMC Trading Bot</h1>
  <p>লগইন করে ড্যাশবোর্ডে প্রবেশ করুন</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" autocomplete="on">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Login</button>
  </form>
</main>
</body>
</html>
