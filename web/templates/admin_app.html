<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06172e">
<title>MMC Admin App</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#06172e;color:#e8f2ff;font-family:Inter,Arial,Helvetica,sans-serif;overflow:hidden}.shell{height:100%;display:flex;flex-direction:column}.bar{height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;background:#061426;border-bottom:1px solid #12365d}.brand{display:flex;align-items:center;gap:9px;min-width:0}.brand b{font-size:18px}.brand small{display:block;color:#21a1ff;font-size:9px;font-weight:800;margin-top:2px}.badge{padding:5px 8px;border-radius:999px;background:#0a3d68;border:1px solid #1769a6;color:#7bc8ff;font-size:9px;font-weight:900}.actions{display:flex;align-items:center;gap:7px}.actions a{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 11px;border-radius:7px;text-decoration:none;font-size:10px;font-weight:900;color:#fff;border:1px solid #23537d;background:#0b2743}.actions a.admin{background:#145fbe;border-color:#287dd0}.actions a.logout{background:#3b1720;border-color:#71303b}.frame{flex:1;min-height:0;border:0;width:100%;background:#06172e}
@media(max-width:600px){.bar{height:auto;min-height:58px;padding:8px 10px;flex-wrap:wrap}.brand{flex:1}.badge{display:none}.actions{width:100%}.actions a{flex:1}.frame{min-height:0}}
</style>
</head>
<body>
<div class="shell">
  <header class="bar">
    <div class="brand"><div><b>MMC ADMIN APP</b><small>FULL SIGNAL SYSTEM + OWNER CONTROLS</small></div><span class="badge">{{ user.role|upper }}</span></div>
    <nav class="actions">
      <a href="{{ url_for('index') }}" target="_blank" rel="noopener">Signal App</a>
      <a class="admin" href="{{ url_for('admin_panel') }}" target="_blank" rel="noopener">Admin Panel</a>
      <a class="logout" href="{{ url_for('logout') }}">Logout</a>
    </nav>
  </header>
  <iframe class="frame" src="{{ url_for('index') }}" title="MMC Signal System"></iframe>
</div>
</body>
</html>
