plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kayum.mmc_trading_bot'
    compileSdk 36

    defaultConfig {
        applicationId 'com.kayum.mmc_trading_bot'
        minSdk 23
        targetSdk 36
        versionCode (project.findProperty('versionCode') ?: '1').toInteger()
        versionName (project.findProperty('versionName') ?: '1.0')
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'BUILD_CHANNEL', '"github"'
        }
        release {
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            buildConfigField 'String', 'BUILD_CHANNEL', '"github"'
        }
    }

    signingConfigs {
        release {
            def keystoreFile = System.getenv('ANDROID_KEYSTORE_FILE')
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
}
