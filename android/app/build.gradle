plugins {
    id 'com.android.application'
}

def buildEpochMinutes = (System.currentTimeMillis() / 60000L) as int

def suppliedVersionCode = project.findProperty('versionCode')
def appVersionCode = suppliedVersionCode ? suppliedVersionCode.toInteger() : buildEpochMinutes
def appVersionName = project.findProperty('versionName') ?: "1.${appVersionCode}"

android {
    namespace 'com.kayum.mmc_trading_bot'
    compileSdk 36

    defaultConfig {
        applicationId 'com.kayum.mmc_trading_bot'
        minSdk 23
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'BUILD_CHANNEL', '"github"'
            buildConfigField 'long', 'BUILD_TIMESTAMP_MS', "${System.currentTimeMillis()}L"
        }
        release {
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            buildConfigField 'String', 'BUILD_CHANNEL', '"github"'
            buildConfigField 'long', 'BUILD_TIMESTAMP_MS', "${System.currentTimeMillis()}L"
        }
    }

    signingConfigs {
        release {
            def keystoreFile = System.getenv('ANDROID_KEYSTORE_FILE')
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
