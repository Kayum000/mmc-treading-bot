services:
  - type: web
    name: mmc-treading-bot
    runtime: docker
    repo: https://github.com/Kayum000/mmc-treading-bot
    branch: main
    region: oregon
    plan: free
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_SIGNALS_ENABLED
        value: "true"
