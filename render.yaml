services:
  - type: web
    name: mmc-treading-bot
    runtime: docker
    repo: https://github.com/Kayum000/mmc-treading-bot
    branch: main
    region: oregon
    plan: free
    autoDeploy: false
    dockerfilePath: ./Dockerfile

  - type: worker
    name: mmc-quotex-cloud-collector
    runtime: docker
    repo: https://github.com/Kayum000/mmc-treading-bot
    branch: main
    region: oregon
    plan: starter
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile.quotex-cloud
    envVars:
      - key: MMC_BOT_URL
        value: https://mmc-treading-bot.onrender.com
      - key: QUOTEX_URL
        value: https://market-qx.trade/en/demo-trade
      - key: QUOTEX_REAL_ASSET
        value: AUDCAD
      - key: QUOTEX_INGEST_SECRET
        sync: false
      - key: QUOTEX_STORAGE_STATE_B64
        sync: false
      - key: QUOTEX_LOGIN_EMAIL
        sync: false
      - key: QUOTEX_LOGIN_PASSWORD
        sync: false
